<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registro de alumnos</title>
    </head>
    <body>
        <h1>Registro de alumnos</h1>

        <label for="grupo"> Grupo: </label>
        <select id="grupo" name="grupo" onchange="filtrarGrupo()">
            <option value="">Todos</option>
            <option value="1A">1A</option>
            <option value="3B">3B</option>
            <option value="5A">5A</option>
        </select>
        <br>
        <br>

        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Grupo</th>
                    <th>Calificación</th>
                    <th>Asistencias</th>
                    <th>Inasistencias</th>
                </tr>
            </thead>
            <tbody id="filas">
                <tr data-grupo="1A">
                    <td>Manuel</td>
                    <td>1A</td>
                    <td>8.7</td>
                    <td>92</td>
                    <td>3</td>
                </tr>
                <tr data-grupo="3B">
                    <td>Manuel</td>
                    <td>3B</td>
                    <td>7.8</td>
                    <td>85</td>
                    <td>10</td>
                </tr>
                <tr data-grupo="5A">
                    <td>Manuel</td>
                    <td>5A</td>
                    <td>9.2</td>
                    <td>98</td>
                    <td>1</td>
                </tr>
            </tbody>
        </table>
        <br>
        <a href="{{ url_for('panel_principal') }}">Volver al panel principal</a>

        <script>
            function filtrarGrupo() {
                var grupo = document.getElementById('grupo').value;
                var filas = document.querySelectorAll('#filas tr');
                for (var i = 0; i < filas.length; i++) {
                    if (grupo === '' || filas[i].dataset.grupo === grupo) {
                        filas[i].style.display = '';
                    } else {
                        filas[i].style.display = 'none';
                    }
                }
            }
        </script>
    </body>
</html>
