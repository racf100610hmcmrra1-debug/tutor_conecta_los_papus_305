<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tutor Conecta</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/estilos.css') }}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f5ff;
            color: #1e293b;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        main {
            margin: 60px auto;
            padding: 30px;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000015;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px 25px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .enlace {
            margin-top: 25px;
        }

        .enlace a {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <header>
        <h1>Tutor Conecta</h1>
        <p>Conectando familias</p>
    </header>

    <main>

        <h2>Crear cuenta</h2>

        <form action="{{ url_for('inicio_sesion') }}" method="get">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email"
                   placeholder="ejemplo@correo.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="Crea una contraseña"
                   minlength="8" required>

            <button type="submit">Registrarse</button>

        </form>

        <div class="enlace">
            <p>¿Ya tienes una cuenta?</p>
            <a href="{{ url_for('inicio_sesion') }}">Iniciar sesión</a>
            <br><br>
            <a href="{{ url_for('inicio') }}">Volver al panel principal</a>
        </div>

    </main>

</body>
</html>
